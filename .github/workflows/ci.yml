name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

      - name: Formato
        run: pnpm format:check

      - name: Validar migraciones (Supabase local)
        run: |
          pnpm exec supabase db start
          pnpm exec supabase db reset

      - name: Pruebas de base de datos (RLS, bitácora, storage)
        run: pnpm exec supabase test db

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Levantar Supabase local (migraciones + seed)
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Variables de entorno de la app
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          url=$(grep -E '^API_URL=' "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"')
          clave=$(grep -E '^(ANON_KEY|PUBLISHABLE_KEY)=' "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"')
          if [ -z "$url" ] || [ -z "$clave" ]; then
            echo "::error::supabase status no devolvió API_URL o ANON_KEY"
            cut -d= -f1 "$RUNNER_TEMP/supabase.env"
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$clave" >> "$GITHUB_ENV"
          # Procesador de trabajos (solo servidor): clave de servicio local y un secreto de prueba.
          servicio=$(grep -E '^(SERVICE_ROLE_KEY|SECRET_KEY)=' "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"')
          if [ -z "$servicio" ]; then
            echo "::error::supabase status no devolvió SERVICE_ROLE_KEY"
            exit 1
          fi
          echo "::add-mask::$servicio"
          echo "SUPABASE_SERVICE_ROLE_KEY=$servicio" >> "$GITHUB_ENV"
          echo "CRON_SECRET=secreto-solo-para-pruebas-e2e" >> "$GITHUB_ENV"

      - name: Navegador de Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Pruebas e2e
        run: pnpm test:e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
